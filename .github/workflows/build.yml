name: Tulu Panchanga (Flutter)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One build at a time per branch, so two builds never replace the
# tulu-panchanga-latest release at the same moment.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Export Mangaluru CSVs (current and next year)
        run: |
          Y=$(date +%Y)
          for y in $Y $((Y+1)); do
            dart run tool/export_csv.dart --year $y --place mangaluru --out build/csv
          done

      # Signs with a fixed key so each build installs as an update. Set the
      # repository secrets TULU_KEYSTORE_BASE64 (base64 of a .jks/.p12),
      # TULU_KEYSTORE_PASSWORD, TULU_KEY_ALIAS and TULU_KEY_PASSWORD; without
      # them the APK is signed with this runner's throwaway debug key.
      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.TULU_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.TULU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TULU_KEY_ALIAS }}
          KEY_PW: ${{ secrets.TULU_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No TULU_KEYSTORE_BASE64 secret: APK is debug-signed and will not install over an earlier build."
            exit 0
          fi
          # Pasted secrets often end in a newline; strip surrounding
          # whitespace. An empty key password means "same as the store".
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\n'; }
          STORE_PW=$(trim "$STORE_PW")
          KEY_ALIAS=$(trim "$KEY_ALIAS")
          KEY_PW=$(trim "$KEY_PW")
          [ -n "$KEY_PW" ] || KEY_PW="$STORE_PW"
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.keystore"
          # keytool's default PKCS12 format ignores a separate key password
          # and protects the key with the store password.
          KS="$RUNNER_TEMP/upload.keystore"
          keytool -list -keystore "$KS" -storepass "$STORE_PW" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1 || {
            echo "::error::TULU_KEYSTORE_PASSWORD or TULU_KEY_ALIAS does not match the keystore."
            exit 1
          }
          INFO=$(keytool -list -keystore "$KS" -storepass "$STORE_PW" 2>/dev/null)
          if echo "$INFO" | grep -qi 'Keystore type: PKCS12'; then
            KEY_PW="$STORE_PW"
          fi
          {
            echo "storeFile=$RUNNER_TEMP/upload.keystore"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      # Android App Bundle for Google Play (Play delivers ~20 MB per phone).
      - name: Build Play app bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: APK size
        run: |
          ls -l build/app/outputs/flutter-apk/app-release.apk
          echo "APK: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1) ($(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play app bundle
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-play-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload CSVs
        uses: actions/upload-artifact@v4
        with:
          name: tulu-panchanga-mangaluru-csv
          path: build/csv/

      # Direct download link (no zip):
      # https://github.com/<owner>/<repo>/releases/download/tulu-panchanga-latest/tulu-panchanga.apk
      # A rolling release, replaced on every main build or manual run.
      - name: Publish APK to the tulu-panchanga-latest release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/tulu-panchanga.apk
          cp build/app/outputs/bundle/release/app-release.aab build/tulu-panchanga.aab
          gh release delete tulu-panchanga-latest --yes --cleanup-tag || true
          gh release create tulu-panchanga-latest build/tulu-panchanga.apk build/tulu-panchanga.aab \
            --target "${{ github.sha }}" --latest \
            --title "Tulu Panchanga (latest build)" \
            --notes "Release APK built from ${{ github.sha }} (build ${{ github.run_number }}). APK (install directly): https://github.com/${{ github.repository }}/releases/download/tulu-panchanga-latest/tulu-panchanga.apk — AAB (upload to Google Play): tulu-panchanga.aab"
