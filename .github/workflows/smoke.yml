name: Smoke test on Android emulators

# Opens the published release APK on emulators and fails on a crash.
# Run it before uploading a release to Google Play.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK URL to test (empty = the latest release build)'
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 33, 35]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          url=${APK_URL:-https://github.com/${{ github.repository }}/releases/download/tulu-panchanga-latest/tulu-panchanga.apk}
          curl -sSfL -o app.apk "$url"
          ls -l app.apk

      - name: Run on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tool/smoke_test.sh app.apk com.tulupanchanga.app
